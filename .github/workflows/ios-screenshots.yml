name: iOS build + visual review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-capture:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Boot iPhone 16 simulator
        run: |
          UDID=$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin); c=[x for group in d['devices'].values() for x in group if x.get('name') == 'iPhone 16' and x.get('isAvailable',True)]; print(c[0]['udid'] if c else '')")
          if [ -z "$UDID" ]; then
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          rm -rf /tmp/start-shots

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project START.xcodeproj \
            -scheme START \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' \
            build

      - name: Prepare visual-review folder
        run: mkdir -p visual-review/screenshots visual-review/video

      - name: Record simulator preview
        run: |
          xcrun simctl io "$UDID" recordVideo --codec=hevc visual-review/video/START-session.mp4 > "$RUNNER_TEMP/record-video.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/start-video.pid"
          sleep 2

      - name: Run UI tests and capture each screen
        run: |
          set -o pipefail
          xcodebuild \
            -project START.xcodeproj \
            -scheme START \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData \
            -only-testing:STARTUITests/STARTScreenshotTests/testScreenshots \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' \
            test | tee xcodebuild-test.log

      - name: Stop simulator preview recording
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/start-video.pid" ]; then
            kill -INT "$(cat "$RUNNER_TEMP/start-video.pid")" 2>/dev/null || true
            sleep 3
          fi

      - name: Collect screenshots and test result attachments
        if: always()
        run: |
          cp /tmp/start-shots/*.png visual-review/screenshots/ 2>/dev/null || true
          XCRESULT=$(find DerivedData/Logs/Test -maxdepth 1 -name '*.xcresult' -print 2>/dev/null | sort | tail -n 1)
          if [ -n "$XCRESULT" ]; then
            mkdir -p "$RUNNER_TEMP/xc-attachments"
            xcrun xcresulttool export attachments --path "$XCRESULT" --output-path "$RUNNER_TEMP/xc-attachments" || true
            find "$RUNNER_TEMP/xc-attachments" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) -exec cp -n {} visual-review/screenshots/ \; || true
          fi
          if [ -z "$(ls -A visual-review/screenshots 2>/dev/null)" ]; then
            echo 'No UI-test screenshots were found.' > visual-review/SCREENSHOTS-MISSING.txt
          fi
          find visual-review -maxdepth 2 -type f -print

      - name: Generate contact sheet
        if: always()
        run: |
          if find visual-review/screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) | grep -q .; then
            swift Scripts/make_contact_sheet.swift visual-review/screenshots visual-review/START-contact-sheet.png
          fi

      - name: Upload screenshots and contact sheet
        if: always()
        id: upload-screenshots
        uses: actions/upload-artifact@v4
        with:
          name: START-prints
          path: |
            visual-review/screenshots/
            visual-review/START-contact-sheet.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator video
        if: always()
        id: upload-video
        uses: actions/upload-artifact@v4
        with:
          name: START-dice-preview
          path: visual-review/video/START-session.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Add review links to run summary
        if: always()
        run: |
          echo '## START — revisão visual' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Baixar prints individuais e montagem geral](${{ steps.upload-screenshots.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Baixar vídeo da sessão no simulador](${{ steps.upload-video.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and UI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: START-build-test-logs
          path: |
            xcodebuild-test.log
            DerivedData/Logs/Test/**/*.xcresult
          if-no-files-found: warn
          retention-days: 14
