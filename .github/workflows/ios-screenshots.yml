name: iOS build + visual review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-capture:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Boot iPhone 16 simulator
        run: |
          UDID=$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin); c=[x for group in d['devices'].values() for x in group if x.get('name') == 'iPhone 16' and x.get('isAvailable',True)]; print(c[0]['udid'] if c else '')")
          if [ -z "$UDID" ]; then
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Build for iOS Simulator
        id: build
        run: |
          xcodebuild \
            -project START.xcodeproj \
            -scheme START \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' \
            build

      - name: Prepare visual-review folder
        run: |
          mkdir -p visual-review/screenshots visual-review/video
          cp Blender/START-dice-studio.png visual-review/START-dice-blender-preview.png

      - name: Run app interaction tests
        run: |
          set -o pipefail
          xcodebuild \
            -project START.xcodeproj \
            -scheme START \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData \
            -only-testing:STARTUITests/STARTScreenshotTests/testFirstLaunchOnboarding \
            -only-testing:STARTUITests/STARTScreenshotTests/testDiceGalleryCaptureResults \
            -only-testing:STARTUITests/STARTScreenshotTests/testMVPInteractions \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' \
            test | tee xcodebuild-test.log

      - name: Capture full-screen iPhone screenshots
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p visual-review/screenshots visual-review/video visual-review/dice-rolls
          capture_screen() {
            local name="$1"
            local route="$2"
            local settle="$3"
            xcrun simctl terminate "$UDID" com.start.companion 2>/dev/null || true
            if [ "$route" = onboarding ]; then
              xcrun simctl launch "$UDID" com.start.companion -capture-onboarding
            elif [ "$route" = home ]; then
              xcrun simctl launch "$UDID" com.start.companion -screenshot-mode
            else
              xcrun simctl launch "$UDID" com.start.companion -screenshot-mode "-capture-$route"
            fi
            sleep "$settle"
            xcrun simctl io "$UDID" screenshot "visual-review/screenshots/$name.png"
          }
          capture_screen 00-onboarding onboarding 1
          capture_screen 01-home home 1
          capture_screen 02-dice dice 3
          capture_screen 03-finger finger 1
          capture_screen 04-cards cards 2
          capture_screen 05-full-deck full-deck 1
          capture_screen 06-situations situations 1

          capture_die_frame() {
            local sides="$1"
            xcrun simctl terminate "$UDID" com.start.companion 2>/dev/null || true
            xcrun simctl launch "$UDID" com.start.companion -screenshot-mode "-capture-die-$sides"
            sleep 3
            xcrun simctl io "$UDID" screenshot "visual-review/dice-rolls/D$sides.png"
          }
          for sides in 4 6 8 10 12 20; do
            capture_die_frame "$sides"
          done

      - name: Record all-dice reel
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p visual-review/video
          xcrun simctl terminate "$UDID" com.start.companion 2>/dev/null || true
          xcrun simctl launch "$UDID" com.start.companion -capture-dice-reel
          sleep 1.5
          xcrun simctl io "$UDID" recordVideo --codec=hevc visual-review/video/START-all-dice.mp4 > "$RUNNER_TEMP/record-video.log" 2>&1 &
          VIDEO_PID=$!
          sleep 22
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          sleep 2

      - name: Check screenshot files
        if: always()
        run: |
          mkdir -p visual-review/screenshots visual-review/dice-rolls
          count=$(find visual-review/screenshots -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Captured $count full-screen PNGs."
          if [ "$count" -ne 7 ]; then
            echo "Expected 7 simulator screenshots, received $count." > visual-review/SCREENSHOTS-MISSING.txt
          fi
          dice_count=$(find visual-review/dice-rolls -maxdepth 1 -type f -name 'D*.png' | wc -l | tr -d ' ')
          echo "Captured $dice_count die-result PNGs."
          if [ "$dice_count" -ne 6 ]; then
            echo "Expected 6 dice result screenshots, received $dice_count." > visual-review/DICE-SCREENSHOTS-MISSING.txt
          fi
          find visual-review -maxdepth 2 -type f -print

      - name: Generate contact sheet
        if: always()
        run: |
          if find visual-review/screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) | grep -q .; then
            swift Scripts/make_contact_sheet.swift visual-review/screenshots visual-review/START-contact-sheet.png
          fi
          if find visual-review/dice-rolls -maxdepth 1 -type f -name '*.png' | grep -q .; then
            swift Scripts/make_contact_sheet.swift visual-review/dice-rolls visual-review/START-dice-contact-sheet.png
          fi

      - name: Upload screenshots and contact sheet
        if: always()
        id: upload-screenshots
        uses: actions/upload-artifact@v4
        with:
          name: START-prints
          path: |
            visual-review/screenshots/
            visual-review/START-contact-sheet.png
            visual-review/START-dice-blender-preview.png
            visual-review/dice-rolls/
            visual-review/START-dice-contact-sheet.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload simulator video
        if: always()
        id: upload-video
        uses: actions/upload-artifact@v4
        with:
          name: START-all-dice-reel
          path: visual-review/video/START-all-dice.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Add review links to run summary
        if: always()
        run: |
          echo '## START — revisão visual' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Baixar prints individuais e montagem geral](${{ steps.upload-screenshots.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Baixar reel com os seis dados rolando](${{ steps.upload-video.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and UI test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: START-build-test-logs
          path: |
            xcodebuild-test.log
            DerivedData/Logs/Test/**/*.xcresult
          if-no-files-found: warn
          retention-days: 14
